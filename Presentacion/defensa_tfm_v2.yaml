  notas: Recorrer el índice en 20 segundos.
- diseno: imagen
  numero: '01'
  titulo: Vigilancia en aguas residuales
  imagen: figuras_v2/vigilancia_dos_rutas.png
  pie: 'Ahmed et al., 2020; Medema et al., 2020: primeros reportes de SARS-CoV-2 en aguas residuales'
  notas: 'Idea: el alcantarillado ofrece una lectura poblacional independiente del sistema de salud. (1 min)

    Texto de la versión 1 (para decirlo en voz alta): Las aguas residuales reúnen el material que excreta la población
    conectada al alcantarillado, con o sin síntomas, sin depender de la consulta ni de la notificación de casos
    (Sims & Kasprzyk-Hordern, 2020; Parkins et al., 2023).  En las primeras semanas de la pandemia, el ARN de SARS-CoV-2
    se detectó en aguas residuales de Australia y de Países Bajos mientras la vigilancia clínica estaba limitada
    (Ahmed et al., 2020; Medema et al., 2020).'
- diseno: imagen
  numero: '01'
  titulo: Antecedente en Quitumbe
  imagen: figuras_v2/antecedente_quitumbe.png
  notas: 'Esta tesis parte de ese sitio centinela ya validado y lo amplía a otros virus. (1 min)

    El aporte anual de genomas cayó de 5 102 en 2022 a 744 en 2024: la vigilancia genómica clínica se redujo.

    Texto de la versión 1 (para decirlo en voz alta): Mejía Calle (2024) instaló un muestreo pasivo semanal de 24
    h con un dispositivo impreso en 3D en el influente de la PTAR Quitumbe, que recibe las aguas de once barrios
    de Quito (75 L/s). La secuenciación Nanopore detectó el linaje JN.1 en el agua antes que en pacientes.  Ecuador
    depositó 12 619 genomas de SARS-CoV-2 entre 2020 y 2024, y solo 744 en 2024 (Bruno et al., 2025). Para RSV y
    poliovirus no hay datos ambientales ecuatorianos.'
- diseno: imagen
  numero: '01'
  titulo: Por qué estos tres virus
  imagen: figuras_v2/tres_virus.png
  pie: Crits-Christoph et al., 2021; Zurbriggen et al., 2008; Hughes et al., 2022
  notas: 'En 2024 se halló poliovirus derivado de vacuna tipo 2 en aguas residuales de Finlandia, Alemania, Polonia,
    España y Reino Unido (Böttcher et al., 2025). (1 min)

    RSV: alta carga en lactantes, adultos mayores e inmunocomprometidos.

    Texto de la versión 1 (para decirlo en voz alta): SARS-CoV-2: La secuenciación del agua residual reconstruye
    los linajes que circulan en la población (Crits-Christoph et al., 2021). Enterovirus: El poliovirus causa parálisis
    en 1 de cada 100 infecciones o menos; el agua detecta su circulación silenciosa (Zurbriggen et al., 2008). RSV:
    Su ARN en aguas residuales acompaña la positividad clínica, con τ de Kendall de 0,65 a 0,77 (Hughes et al.,
    2022).'
- diseno: contenido
  numero: '02'
  titulo: Pregunta de investigación
  texto: ¿Qué evidencia molecular y genómica de SARS-CoV-2, enterovirus y virus sincitial respiratorio puede identificarse
    en las aguas residuales de la PTAR Quitumbe, en Quito?
  notas: 'Leer la pregunta completa; las conclusiones la responden al final. (40 s)

    El objetivo general está en la siguiente diapositiva, sobre los cuatro objetivos específicos.'
- diseno: imagen
  numero: '02'
  titulo: Objetivos
  imagen: figuras_v2/objetivos.png
  notas: '(40 s)

    Texto de la versión 1 (para decirlo en voz alta): 1. Identificar material genético de los tres virus en el influente
    de la PTAR Quitumbe. 2. Caracterizar, cuando la calidad de los datos lo permita, las señales genómicas mediante
    secuenciación y bioinformática. 3. Interpretar los resultados frente a la vigilancia en aguas residuales y al
    contexto local. 4. Identificar alcances y limitaciones del análisis multipatógeno en una matriz ambiental compleja.'
- diseno: tabla
  numero: '03'
  titulo: Diseño del estudio
  encabezados:
  - Fase
  - Semanas
  - Muestras
  - Virus analizados
  filas:
  - - Prospectiva
    - 1–42
    - '42'
    - SARS-CoV-2
  - - Prospectiva multipatógeno
    - 43–56
    - '14'
    - Enterovirus y RSV
  - - Retrospectiva conservada
    - 17–20 y 34–37
    - '8'
    - Enterovirus y RSV
  texto: 'Estudio observacional, descriptivo y longitudinal: 56 semanas consecutivas en el influente de la PTAR
    Quitumbe, del 14 de abril de 2025 al 10 de mayo de 2026.

    '
  notas: 'Enterovirus y RSV suman 22 muestras cada uno: 14 prospectivas y 8 retrospectivas. (1 min)

    Las retrospectivas se conservaron en DNA/RNA Shield 2X y en PBS 1X.

    '
- diseno: imagen
  numero: '03'
  titulo: Muestreo pasivo
  imagen: figuras/dispositivo.png
  lado: derecha
  ancho: 680
  texto: '**Torpedo** con gasas, nailon e hisopo


    **24 h** en el pozo de entrada


    **4 °C** hasta el laboratorio'
  notas: 'El muestreo pasivo no requiere equipos automáticos y funciona en sitios con infraestructura limitada (Parkins
    et al., 2023). (1 min)


    Texto de la v1: Dispositivo tipo torpedo con gasas, membrana de nailon e hisopo, sumergido 24 h en el pozo de
    entrada, antes de cualquier tratamiento.  Se transporta a 4 °C al Instituto de Microbiología de la USFQ (Mejía
    Calle, 2024).'
- diseno: imagen
  numero: '03'
  titulo: Flujo multipatógeno
  imagen: figuras/flujo_multipatogeno.png
  pie: Etapas comunes en azul; en color, las específicas de cada virus.
  notas: 'Concentración: 4 g de muestra, PEG con NaCl, centrifugación y resuspensión en DNA/RNA Shield 2X. (1,5
    min)

    Extracción: kit Quick-RNA Viral (Zymo Research).

    SARS-CoV-2: RT-qPCR Luna (N1-HEX, N2-FAM, RP-Cy5) y PCR multiplex NEBNext ARTIC con cebadores ARTIC o VarSkip.

    Enterovirus: PCR anidada, primera ronda pan-enterovirus (5''NTR y Cre), segunda ronda VP1 (Y7 y Q8), protocolo
    DDNS (Shaw et al., 2020).

    RSV: PCR multiplex con cebadores para RSV-A y RSV-B.

    '
- diseno: imagen
  numero: '03'
  titulo: Selección y controles
  imagen: figuras_v2/seleccion_muestras.png
  pie: Oxford Nanopore SQK-NBD114.96, celdas R10.4.1
  notas: 'El influente tiene baja carga e inhibidores: por eso la selección combina Cq y banda. (1 min)

    Texto de la versión 1 (para decirlo en voz alta): RT-qPCR con el control positivo del kit y un control sin molde,
    sin señal en N1 ni en N2. PCR multiplex con un control positivo de hisopados faríngeos de carga conocida. A
    secuenciación, solo las muestras con banda del tamaño esperado y Cq < 35. Oxford Nanopore (SQK-NBD114.96, celdas
    R10.4.1); consenso en EPI2ME, linajes con Nextclade e identificación por BLAST.'
- diseno: imagen
  numero: '04'
  titulo: Rendimiento por virus
  imagen: figuras/rendimiento.png
  lado: izquierda
  ancho: 600
  texto: '**SARS-CoV-2:** 23 de 42 muestras secuenciadas y 6 con linaje.


    **Enterovirus:** 2 de 22 caracterizadas, ambas Coxsackievirus A.


    **RSV:** 4 de 22 secuenciadas, sin subgrupo.

    '
  notas: 'Panorama antes de entrar a cada virus: la secuenciación rindió de forma desigual entre virus. (1 min)

    '
- diseno: imagen
  numero: '04'
  titulo: Valores de Cq de SARS-CoV-2
  imagen: figuras/cq_sars.png
  pie: 'El eje está invertido: más arriba, más carga viral. Genes N1 (HEX) y N2 (FAM).'
  notas: '31 de las 42 muestras dieron Cq para N1. En las semanas 15, 18–20, 22, 26, 27 y 31 no amplificó N1 ni
    N2. (1 min)

    '
- diseno: tabla
  numero: '04'
  titulo: Cq y caracterización genómica
  encabezados:
  - Resultado de la secuenciación
  - n
  - Cq N1 (rango)
  - Cq N1 medio
  filas:
  - - Linaje determinado
    - '6'
    - 33,1–35,8
    - 34,0
  - - Secuenciado, sin determinar
    - '15'
    - 33,9–42,3
    - 36,6
  - - No secuenciado (con Cq)
    - '10'
    - 34,4–42,9
    - 38,5
  texto: 'Las medias crecen con la pérdida de información genómica, pero los rangos se solapan: el Cq acompaña la
    probabilidad de caracterizar sin determinarla por sí solo.

    '
  notas: (1 min)
- diseno: imagen
  numero: '04'
  titulo: Linajes de SARS-CoV-2
  imagen: figuras/linajes_sars.png
  lado: derecha
  ancho: 640
  texto: '**6 linajes**, semanas 3–9


    Todos descendientes de **JN.1**


    Desde la semana 10: sin linaje'
  notas: 'Asignación con Nextclade. La detección de JN.1 reproduce el antecedente local (Mejía Calle, 2024). (1
    min)


    Texto de la v1: Seis muestras de las semanas 3 a 9 (28 abr – 9 jun 2025), todas descendientes de JN.1: clado
    24A (JN.1, LZ.5, LU.2.1.1) y clado 24H (LF.7.1.3).  Desde la semana 10, 17 secuencias sin linaje por cobertura
    insuficiente.'
- diseno: imagen
  numero: '05'
  titulo: Enterovirus
  imagen: figuras_v2/enterovirus_vp4.png
  notas: 'El contraste con las referencias de poliovirus 1, 2 y 3 no cambió el resultado: especificidad de los cebadores
    de VP1 menor que la esperada. (1 min)

    Texto de la versión 1 (para decirlo en voz alta): Coxsackievirus A, sin poliovirus Las muestras de las semanas
    45 y 46 (febrero de 2026) dieron amplicones de 1 100 a 1 200 pb en la segunda ronda de la PCR anidada.  El análisis
    los ubicó en la región VP4 (posiciones 529 a 1 049), no en VP1, y BLAST los asignó a Coxsackievirus A. Ninguna
    de las 22 muestras rindió poliovirus.'
- diseno: imagen
  numero: '06'
  titulo: Virus sincitial respiratorio
  imagen: figuras_v2/rsv_embudo.png
  pie: Semanas 50, 52, 53 y 54 (marzo y abril de 2026), todas prospectivas
  notas: '(45 s)

    Texto de la versión 1 (para decirlo en voz alta): Señal sin subgrupo Cuatro de 22 muestras se secuenciaron,
    todas prospectivas: semanas 50, 52, 53 y 54 (marzo y abril de 2026).  EPI2ME no alineó las lecturas con la referencia
    de RSV de la plataforma, de modo que no se asignó subgrupo ni clado.'
- diseno: imagen
  numero: '06'
  titulo: Conservación y secuencia
  imagen: figuras/conservacion.png
  lado: derecha
  ancho: 720
  texto: 'Ninguna de las 8 muestras retrospectivas, en DNA/RNA Shield 2X o en PBS 1X, rindió secuencia.


    Todas las secuencias vinieron de muestras frescas.

    '
  notas: (45 s)
- diseno: imagen
  numero: '06'
  titulo: Ventanas de análisis
  imagen: figuras/heatmap_temporal.png
  pie: Linajes de SARS-CoV-2 en 2025; Coxsackievirus A en febrero de 2026; señal de RSV en marzo y abril de 2026.
  notas: 'SARS-CoV-2 no se analizó en las semanas 43 a 56: no se puede evaluar la co-circulación de los tres virus.
    (1 min)

    '
- diseno: imagen
  numero: '07'
  titulo: La carga viral decide
  imagen: figuras_v2/cq_rangos.png
  pie: Crits-Christoph et al., 2021; Haque et al., 2023
  notas: 'Mecanismo: con poca carga, los dímeros entre cebadores sesgan la cobertura de la PCR por amplicones (Itokawa
    et al., 2020). (1,5 min)

    Un Cq tardío no invalida la detección: confirma presencia y tendencia.

    Texto de la versión 1 (para decirlo en voz alta): Las seis muestras con linaje tuvieron los Cq de N1 más bajos,
    como en el antecedente de Quitumbe (Mejía Calle, 2024).  En aguas residuales, solo las muestras con Cq < 33
    dieron genomas completos (Crits-Christoph et al., 2021); en Dhaka, Cq de 28,8 a 32,1 dieron 94,2–99,8 % de cobertura
    (Haque et al., 2023).'
- diseno: imagen
  numero: '07'
  titulo: Enterovirus y RSV
  imagen: figuras_v2/recuperacion_ev_rsv.png
  pie: O'Reilly et al., 2020; Bubba et al., 2023; Toribio-Avedillo et al., 2024
  notas: 'Enterovirus: la amplificación de VP4 apunta a cebadores de VP1 poco específicos en esta matriz. (1,5 min)

    La ausencia de poliovirus apunta a la baja sensibilidad del muestreo pasivo antes que a una circulación nula:
    Ecuador aplica bOPV.

    RSV: 71 % con ARN desnudo frente a 17 % con partículas envueltas.

    Texto de la versión 1 (para decirlo en voz alta): Enterovirus: Se recuperó en 2 de 22 muestras (9 %), bajo el
    10 % que se espera con muestreo instrumental (O''Reilly et al., 2020; Bubba et al., 2023). RSV: Los genomas
    completos exigen más de 10 000 copias/mL (Le et al., 2025); al ser envuelto, su recuperación cae del 71 % al
    17 % (Toribio-Avedillo et al., 2024).'
- diseno: imagen
  numero: '07'
  titulo: La conservación de la muestra
  imagen: figuras_v2/conservacion_cobertura.png
  pie: 'Barbé et al., 2022: secuenciación Nanopore de SARS-CoV-2 en aguas residuales'
  notas: '(1 min)

    Texto de la versión 1 (para decirlo en voz alta): Con secuenciación Nanopore de SARS-CoV-2, la cobertura mediana
    fue del 94 % con ARN fresco, del 88 % con el extracto congelado y del 55 % con agua residual congelada (Barbé
    et al., 2022).  Las muestras retrospectivas se conservaron sobre la matriz completa, la vía de peor rendimiento,
    y no rindieron secuencia.'
- diseno: imagen
  numero: '07'
  titulo: Limitaciones
  imagen: figuras_v2/limitaciones.png
  notas: 'Además: pocos datos genómicos clínicos de SARS-CoV-2 en Ecuador para comparar (Bruno et al., 2025). (1
    min)

    Texto de la versión 1 (para decirlo en voz alta): Poco material viral en una matriz diluida: Cq altos y cobertura
    insuficiente. Muestras retrospectivas sin secuencia en ambos métodos de conservación. Ventanas temporales con
    poco solapamiento entre virus. 22 muestras de un único sitio para enterovirus y RSV. Cebadores de VP1 que amplificaron
    VP4 y no confirmaron el serotipo.'
- diseno: imagen
  numero: 08
  titulo: Conclusiones
  imagen: figuras_v2/conclusiones_escalera.png
  notas: 'Esta es la respuesta a la pregunta de investigación. (1 min)

    Texto de la versión 1 (para decirlo en voz alta): Un solo flujo de muestreo y procesamiento recuperó los tres
    virus en un sitio centinela urbano.  SARS-CoV-2 se caracterizó con alta carga, con linajes descendientes de
    JN.1; enterovirus y RSV quedaron en detección o presencia.  La carga viral y la conservación de la muestra gobiernan
    hasta dónde llega la caracterización genómica.'
- diseno: imagen
  numero: 08
  titulo: Aporte y recomendaciones
  imagen: figuras_v2/hoja_de_ruta.png
  pie: 'Aporte: primera línea de base molecular y genómica multipatógeno de aguas residuales en Quito'
  notas: 'Cruzar con secuencias clínicas y de repositorios, y mantener la vigilancia de enterovirus por la región
    VP1. (1 min)

    Texto de la versión 1 (para decirlo en voz alta): Aporte: Primera línea de base molecular y genómica multipatógeno
    de aguas residuales en Quito, que incluye un Coxsackievirus A que la vigilancia de parálisis flácida no registra.
    Recomendaciones: Procesar el material poco después de recogerlo, seleccionar por Cq, enriquecer RSV antes de
    secuenciar y ampliar muestras y réplicas.'
