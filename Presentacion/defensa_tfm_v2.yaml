- diseno: indice
  items:
  - titulo: Antecedentes y problema
    texto: Vigilancia en aguas residuales y el antecedente de la PTAR Quitumbe
  - titulo: Pregunta y objetivos
    texto: Qué evidencia molecular y genómica puede recuperarse
  - titulo: Metodología
    texto: Muestreo pasivo, PEG, extracción de ARN, PCR y secuenciación Nanopore
  - titulo: 'Resultados I: SARS-CoV-2'
    texto: Rendimiento, valores de Cq y linajes
  - titulo: 'Resultados II: enterovirus'
    texto: Coxsackievirus A en la región VP4
  - titulo: 'Resultados III: RSV y conservación'
    texto: Señal sin subgrupo y muestras retrospectivas
  - titulo: Discusión y limitaciones
    texto: Carga viral, especificidad y conservación
  - titulo: Conclusiones y aporte
