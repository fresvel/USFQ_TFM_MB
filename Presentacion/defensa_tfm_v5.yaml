  notas: RSV se intentó en las 22 muestras. Las de las semanas 50, 52, 53 y 54 mostraron bandas y se secuenciaron en ocho
    bibliotecas, con 581 826 lecturas, pero ninguna alineó con RSV-A ni con RSV-B. Entre el 73 y el 78 % de las lecturas llevaba
    cebadores del esquema en sus extremos y medía de 155 a 234 pb, por debajo de los 400 pb de los amplicones, así que las
    bandas fueron amplificación inespecífica. Sin RT-qPCR de RSV, el resultado es un intento de detección negativo. (45 s)
