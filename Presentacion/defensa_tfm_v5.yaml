titulo: Defensa TFM (v5) — Análisis genómico de SARS-CoV-2, enterovirus y RSV en aguas residuales
marca: usfq
pie: Eliana Viscarra · Maestría en Microbiología · USFQ
diapositivas:
- diseno: portada
  titulo: “Análisis genómico de SARS-CoV-2, enterovirus y virus sincitial respiratorio en aguas residuales”
  datos:
  - '**Candidata:** Eliana Viscarra'
  - '**Programa:** Maestría en Microbiología'
  columnas:
  - titulo: Director de tesis
    items:
    - Paúl Cárdenas, PhD — USFQ
  - titulo: Miembros del comité
    items:
    - Verónica Barragán, PhD — USFQ
    - Henry Vaca, Mgtr. — PTAR Quitumbe
    - Shazia Ruybal, PhD — Universitat de Barcelona
  notas: 'Saludo al tribunal y agradecimiento al director y al comité. (30 s)

    '
- diseno: indice
  items:
  - titulo: Antecedentes y problema
    texto: Vigilancia en aguas residuales y el antecedente de la PTAR Quitumbe
  - titulo: Pregunta y objetivos
    texto: Qué evidencia molecular y genómica puede recuperarse
  - titulo: Metodología
    texto: Muestreo pasivo, PEG, extracción de ARN, PCR y secuenciación Nanopore
  - titulo: 'Resultados I: SARS-CoV-2'
    texto: Rendimiento, valores de Cq y linajes
  - titulo: 'Resultados II: enterovirus'
    texto: Coxsackievirus A1 en la región VP1
  - titulo: 'Resultados III: virus sincitial respiratorio'
    texto: Sin lecturas del virus y muestras retrospectivas
  - titulo: Limitaciones
    texto: Matriz, conservación, diseño temporal y controles
  - titulo: Conclusiones y aporte
    texto: Respuesta a la pregunta y recomendaciones
  notas: Recorrer el índice en 20 segundos.
