    infecciones o menos; el agua detecta su circulación silenciosa (Zurbriggen et al., 2008). RSV: Su ARN en aguas residuales
    acompaña la positividad clínica, con τ de Kendall de 0,65 a 0,77 (Hughes et al., 2022).'
