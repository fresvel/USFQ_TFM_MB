- diseno: columnas
  numero: '03'
  titulo: Enterovirus y RSV
  columnas:
  - titulo: 'Enterovirus: PCR anidada de VP1'
    texto:
    - '1.ª ronda: cebadores pan-enterovirus (5''NTR y Cre)'
    - '2.ª ronda: región VP1 con Y7 y Q8'
    - Protocolo DDNS de detección directa por Nanopore
  - titulo: 'RSV: PCR multiplex ARTIC RSV'
    texto:
    - Amplicones de ~400 pb en dos pools por subgrupo (A y B)
    - ARN diluido y sin diluir, por duplicado
    - 'Selección solo por bandas: sin RT-qPCR de RSV'
  cita: Arita et al. (2015); Shaw et al. (2020); Maloney et al. (2025)
  notas: 'Enterovirus siguió el protocolo DDNS de detección directa de poliovirus por secuenciación Nanopore: una PCR anidada
    cuya primera ronda usa cebadores pan-enterovirus de las regiones 5''NTR y Cre, y la segunda amplifica VP1 con los cebadores
    Y7 y Q8. VP1 es la región que distingue poliovirus Sabin, salvaje y derivado de la vacuna. RSV se intentó con el esquema
    ARTIC RSV, amplicones de unos 400 pb en dos pools por subgrupo, por duplicado con ARN diluido y sin diluir. Como RSV no
    tuvo RT-qPCR, la selección para secuenciar dependió solo de las bandas del gel. (1 min)'
- diseno: columnas
  numero: '03'
  titulo: Secuenciación ONT
  columnas:
  - titulo: Bibliotecas
    texto:
    - Native Barcoding Kit 96 V14 (SQK-NBD114.96)
    - Reparación de extremos, código de barras por muestra y adaptadores
    - Celdas R10.4.1 · MinKNOW y Dorado
  - titulo: Análisis
    texto:
    - 'SARS-CoV-2: EPI2ME wf-artic, Nextclade y Freyja'
    - 'Enterovirus: minimap2 contra la especie C, BLAST y árbol de VP1'
    - 'RSV: minimap2 contra RSV-A y RSV-B'
  cita: Oxford Nanopore Technologies (2025); Aksamentov et al. (2021); Karthikeyan et al. (2022)
  notas: 'Los amplicones se secuenciaron con el Native Barcoding Kit 96 V14 en celdas R10.4.1: reparación de extremos, un
    código de barras por muestra, agrupación y ligación de adaptadores. MinKNOW y Dorado hicieron el basecalling y la demultiplexación.
    Para SARS-CoV-2, EPI2ME generó los consensos, Nextclade asignó clado y linaje, y Freyja estimó la mezcla de linajes. Para
    enterovirus, las lecturas se alinearon contra un panel de la especie C, el consenso de VP1 se comparó con BLAST y se contrastó
    con un árbol de máxima verosimilitud. Para RSV, las lecturas se alinearon contra RSV-A y RSV-B. (1 min)'
