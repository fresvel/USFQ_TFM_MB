  texto: 'Estudio observacional, descriptivo y longitudinal: 56 semanas consecutivas en el influente de la PTAR Quitumbe,
    del 14 de abril de 2025 al 10 de mayo de 2026.


    En total se analizaron 22 muestras para enterovirus y para RSV.'
  notas: 'Enterovirus y RSV suman 22 muestras cada uno: 14 prospectivas y 8 retrospectivas. (1 min)

    Las retrospectivas se conservaron en DNA/RNA Shield 2X y en PBS 1X.

    '
- diseno: imagen
  numero: '04'
  titulo: Resultados por virus
  imagen: figuras_v5/rendimiento.png
  lado: izquierda
  ancho: 600
  texto: '**SARS-CoV-2:** 21 de 42 muestras secuenciadas y 6 con linaje.


    **Enterovirus:** 2 de 22 caracterizadas, ambas Coxsackievirus A1 (VP1).


    **RSV:** 4 de 22 secuenciadas, sin lecturas del virus.'
  notas: 'Panorama antes de entrar a cada virus: la secuenciación rindió de forma desigual. De las 42 muestras de SARS-CoV-2
    se secuenciaron 21 y 6 permitieron asignar clado y linaje. En enterovirus, 2 de 22 muestras dieron secuencia de VP1, tipificada
    como Coxsackievirus A1, y ninguna rindió poliovirus. En RSV se secuenciaron 4 muestras y ninguna aportó lecturas del virus.
    (1 min)'
- diseno: imagen
  numero: '04'
  titulo: Valores de Cq de SARS-CoV-2
  imagen: figuras_v5/cq_sars.png
  pie: 'El eje está invertido: más arriba, más carga viral. Genes N1 (HEX) y N2 (FAM).'
  notas: 'El gen N1 se detectó en 31 de las 42 muestras y N2 en 21, con Cq tardíos propios de una matriz con baja carga. Las
    seis muestras con linaje tuvieron la mediana más baja (34,0), seguidas de las 14 secuenciadas sin caracterización (36,4)
    y de las 11 no secuenciadas (38,5); las diferencias son significativas, pero los rangos se solapan, así que el Cq acompaña
    la probabilidad de recuperar información genómica sin determinarla. El eje está invertido: más arriba, más carga viral.
    (1 min)'
- diseno: imagen
  numero: '04'
  titulo: Linajes de SARS-CoV-2
  imagen: figuras_v5/linajes_sars.png
  lado: derecha
  ancho: 640
  texto: '**6 semanas** con linaje (3 a 9)


    Consenso: JN.1, LZ.5 y LU.2.1.1 (24A) y LF.7.1.3 (24H)


    Freyja: 86–97 % **QA.4**


    Todos descienden de **JN.1**'
  notas: Los consensos de EPI2ME cubrieron entre el 3 y el 17 % del genoma; con esa información parcial, Nextclade ubicó las
    semanas 3 a 8 en el clado 24A (JN.1, LZ.5 y LU.2.1.1) y la semana 9 en el 24H (LF.7.1.3). Freyja, que estima la mezcla
    a partir de todas las lecturas, atribuyó entre el 86 y el 97 % de cada biblioteca a QA.4, un sublinaje de LF.7.1.3. Todos
    son descendientes de JN.1. Los datos describen su presencia conjunta, no una sucesión en el tiempo, y sin un control negativo
    secuenciado no se descarta la contaminación cruzada. (1 min)
