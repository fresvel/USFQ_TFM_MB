    x: 70
    y: 560
    w: 1140
    html: '<p style="text-align:center"><em>Aporte: primera línea de base molecular y genómica multipatógeno de aguas residuales
      en Quito</em></p>'
    tam: 73
    color: negro_usfq
  notas: 'Aporte: la primera línea de base molecular y genómica multipatógeno de aguas residuales en Quito, con SARS-CoV-2,
    enterovirus y RSV en una misma matriz; la PTAR Quitumbe puede funcionar como sitio centinela para varios virus. (1 min)
    Recomendaciones: procesar el material poco después de recogerlo; incluir en cada corrida un control negativo secuenciado
    y, en la RT-qPCR, curva estándar, control de recuperación y PMMoV; para RSV, trabajar con sólidos sedimentados y seleccionar
    por RT-qPCR antes de secuenciar; ampliar muestras y réplicas, cruzar con secuencias clínicas y mantener la vigilancia
    de enterovirus por VP1.'
