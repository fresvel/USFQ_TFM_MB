  notas: Esta es la respuesta a la pregunta de investigación. (1 min) El mismo flujo se aplicó a los tres virus y la evidencia
    difiere entre ellos. SARS-CoV-2 se detectó en la mayoría de las semanas y se caracterizó en seis, con descendientes de
    JN.1. En enterovirus, VP1 permitió tipificar un Coxsackievirus A1, y la ausencia de poliovirus no es concluyente. Para
    RSV el resultado es negativo. La detección resultó más accesible que la caracterización genómica, que dependió de la carga
    viral y de la amplificación.
