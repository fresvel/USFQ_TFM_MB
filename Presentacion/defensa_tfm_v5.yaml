    html: <p style="text-align:left">Sin control positivo de poliovirus, RT-qPCR de RSV ni control negativo secuenciado</p>
    tam: 76
    color: gris_usfq
  notas: 'La principal limitación fue el poco material viral en una matriz diluida: la detección por RT-qPCR no se tradujo
    en caracterización en la mayoría de las muestras. Las retrospectivas, conservadas en Shield 2X y PBS 1X, no rindieron
    secuencia. Los análisis de los tres virus se solaparon poco en el tiempo. Y faltaron controles: sin control positivo de
    poliovirus ni RT-qPCR de RSV, sus negativos no son concluyentes, y sin un control negativo secuenciado no se descarta
    la contaminación entre bibliotecas. Además, hay pocos genomas clínicos de 2025 para comparar (Bruno et al., 2025). (1
    min)'
