  - tipo: imagen
    imagen: figuras_v5/slides/13094830_c0.png
    x: 690
    y: 470
    w: 150
    h: 150
  notas: 'Esta tesis parte de ese sitio centinela ya validado y lo amplía a otros virus. (1 min)

    Mejía Calle (2024) instaló un muestreo pasivo semanal de 24 h con un dispositivo impreso en 3D en el influente de la PTAR
    Quitumbe, en el sur de Quito, que recibe las aguas residuales de quince barrios y reportó un caudal de 75 L/s. Ese estudio
    detectó JN.1 en el agua antes de su identificación clínica. Ecuador depositó 5 102 genomas de SARS-CoV-2 en 2022 y solo
    744 en 2024 (Bruno et al., 2025), y no hay datos ambientales ecuatorianos de RSV ni de poliovirus.'
