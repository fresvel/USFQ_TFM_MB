  notas: 'Mecanismo: con poca carga, los dímeros entre cebadores sesgan la cobertura de la PCR por amplicones (Itokawa et al., 2020). (1,5 min)

    Un Cq tardío no invalida la detección: confirma presencia y tendencia.

    Texto de la versión 1 (para decirlo en voz alta): Las seis muestras con linaje tuvieron los Cq de N1 más bajos, como en el antecedente de
    Quitumbe (Mejía Calle, 2024).  En aguas residuales, solo las muestras con Cq < 33 dieron genomas completos (Crits-Christoph et al., 2021);
    en Dhaka, Cq de 28,8 a 32,1 dieron 94,2–99,8 % de cobertura (Haque et al., 2023).'
- diseno: imagen
  numero: '07'
  titulo: Enterovirus y RSV
  imagen: figuras_v2/recuperacion_ev_rsv.png
  pie: O'Reilly et al., 2020; Bubba et al., 2023; Toribio-Avedillo et al., 2024
  notas: 'Enterovirus: la amplificación de VP4 apunta a cebadores de VP1 poco específicos en esta matriz. (1,5 min)

    La ausencia de poliovirus apunta a la baja sensibilidad del muestreo pasivo antes que a una circulación nula: Ecuador aplica bOPV.

    RSV: 71 % con ARN desnudo frente a 17 % con partículas envueltas.

    Texto de la versión 1 (para decirlo en voz alta): Enterovirus: Se recuperó en 2 de 22 muestras (9 %), bajo el 10 % que se espera con muestreo
    instrumental (O''Reilly et al., 2020; Bubba et al., 2023). RSV: Los genomas completos exigen más de 10 000 copias/mL (Le et al., 2025); al
    ser envuelto, su recuperación cae del 71 % al 17 % (Toribio-Avedillo et al., 2024).'
- diseno: imagen
  numero: '07'
  titulo: La conservación de la muestra
  imagen: figuras_v2/conservacion_cobertura.png
  pie: 'Barbé et al., 2022: secuenciación Nanopore de SARS-CoV-2 en aguas residuales'
  notas: '(1 min)

    Texto de la versión 1 (para decirlo en voz alta): Con secuenciación Nanopore de SARS-CoV-2, la cobertura mediana fue del 94 % con ARN fresco,
    del 88 % con el extracto congelado y del 55 % con agua residual congelada (Barbé et al., 2022).  Las muestras retrospectivas se conservaron
    sobre la matriz completa, la vía de peor rendimiento, y no rindieron secuencia.'
