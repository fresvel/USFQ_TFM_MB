  notas: 'Esta tesis parte de ese sitio centinela ya validado y lo amplía a otros virus. (1 min)

    El aporte anual de genomas cayó de 5 102 en 2022 a 744 en 2024: la vigilancia genómica clínica se redujo.

    Texto de la versión 1 (para decirlo en voz alta): Mejía Calle (2024) instaló un muestreo pasivo semanal de 24 h con un dispositivo impreso
    en 3D en el influente de la PTAR Quitumbe, que recibe las aguas de once barrios de Quito (75 L/s). La secuenciación Nanopore detectó el linaje
    JN.1 en el agua antes que en pacientes.  Ecuador depositó 12 619 genomas de SARS-CoV-2 entre 2020 y 2024, y solo 744 en 2024 (Bruno et al.,
    2025). Para RSV y poliovirus no hay datos ambientales ecuatorianos.'
