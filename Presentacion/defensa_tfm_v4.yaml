  notas: 'Idea: el alcantarillado ofrece una lectura poblacional independiente del sistema de salud. (1 min)

    Texto de la versión 1 (para decirlo en voz alta): Las aguas residuales reúnen el material que excreta la población conectada al alcantarillado,
    con o sin síntomas, sin depender de la consulta ni de la notificación de casos (Sims & Kasprzyk-Hordern, 2020; Parkins et al., 2023).  En
    las primeras semanas de la pandemia, el ARN de SARS-CoV-2 se detectó en aguas residuales de Australia y de Países Bajos mientras la vigilancia
    clínica estaba limitada (Ahmed et al., 2020; Medema et al., 2020).'
